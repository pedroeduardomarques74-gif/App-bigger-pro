      - name: Rebuild APK
        run: |
          set -euxo pipefail
          java -jar apktool.jar b decoded -o biggerpro-v50-unsigned.apk
          test -s biggerpro-v50-unsigned.apk

      - name: Create signing key
        run: |
          keytool -genkeypair -v \
            -keystore biggerpro-v50.keystore \
            -storepass biggerpro123 \
            -keypass biggerpro123 \
            -alias biggerpro \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Grupo Bigger, OU=Android, O=Grupo Bigger, L=Colatina, ST=ES, C=BR"

      - name: Align and sign
        run: |
          set -euxo pipefail
          zipalign -f -p 4 biggerpro-v50-unsigned.apk biggerpro-v50-aligned.apk
          apksigner sign \
            --ks biggerpro-v50.keystore \
            --ks-pass pass:biggerpro123 \
            --key-pass pass:biggerpro123 \
            --out BIGGER-PRO-V50.apk \
            biggerpro-v50-aligned.apk
          apksigner verify --verbose BIGGER-PRO-V50.apk
          ls -lh BIGGER-PRO-V50.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BIGGER-PRO-V50-APK
          path: BIGGER-PRO-V50.apk
          if-no-files-found: error
          retention-days: 7
