name: BIGGER PRO - V50 Build Direto

on:
  workflow_dispatch:

concurrency:
  group: bigger-pro-v50-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gerar APK V50
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Inicio
        run: |
          echo "Runner iniciou corretamente"
          date

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y wget zipalign apksigner
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -O apktool.jar
          java -version
          ls -lh apktool.jar

      - name: Reassemble APK
        run: |
          set -euxo pipefail
          test -f biggerpro.apk.part00
          test -f biggerpro.apk.part01
          test -f biggerpro.apk.part02
          cat biggerpro.apk.part00 biggerpro.apk.part01 biggerpro.apk.part02 > biggerpro.apk
          test -s biggerpro.apk
          ls -lh biggerpro.apk

      - name: Decode APK
        run: |
          set -euxo pipefail
          java -jar apktool.jar d -f biggerpro.apk -o decoded

      - name: Apply premium internal icons
